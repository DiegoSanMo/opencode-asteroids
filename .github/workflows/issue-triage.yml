name: issue-triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número de issue para ejecutar el triage manualmente'
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Triage issue
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        with:
          script: |
            const triage = require('./.github/scripts/triage-issue.js')
            await triage({ github, context, core, issueNumber: process.env.ISSUE_NUMBER })
